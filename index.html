<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">
<style>
  :root{
    --ink:#231f20; --ink-2:#2f2a2b; --orange:#f46b17; --paper:#fff; --muted:#b9b1ad;
    --bar-h:52px; --cta-h:64px;
    color-scheme:dark;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;background:var(--ink);color:var(--paper)}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--cta-h) + env(safe-area-inset-bottom,0px));
  }
  header{
    position:sticky;top:0;z-index:10;
    padding-top:env(safe-area-inset-top,0px);
    background:rgba(35,31,32,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-bottom:3px solid var(--orange);
  }
  .bar{max-width:760px;margin:0 auto;height:var(--bar-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
  .bar h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
  .bar h1 span{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
  .counter{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
  .counter b{color:var(--paper)}
  main{max-width:760px;margin:0 auto;padding:12px 0 24px;display:flex;flex-direction:column;gap:10px}
  figure{margin:0;position:relative;background:var(--ink-2);aspect-ratio:1854/2608;cursor:zoom-in}
  figure img{display:block;width:100%;height:100%;object-fit:contain}
  figure:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .cta{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:var(--ink);border-top:1px solid #3a3435;
  }
  .cta-in{max-width:760px;margin:0 auto;height:var(--cta-h);display:flex;gap:8px;padding:10px 12px}
  .cta a{flex:1;display:flex;align-items:center;justify-content:center;border-radius:10px;text-decoration:none;font-weight:800;font-size:16px}
  .call{background:var(--orange);color:#fff;flex:2.2 !important}
  .pdf{background:transparent;color:var(--paper);border:1.5px solid #5a5253;font-weight:600 !important;font-size:14px !important}
  .cta a:focus-visible{outline:3px solid #fff;outline-offset:2px}
  footer{max-width:760px;margin:0 auto;padding:8px 16px 24px;color:var(--muted);font-size:12px;line-height:1.6;text-align:center}
  /* 확대 보기 */
  .zoom{position:fixed;inset:0;z-index:50;background:#000;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
  .zoom.open{display:block}
  .zoom img{display:block;width:100%;max-width:1800px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
  .zoom button{
    position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;
    width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#000;
    font-size:22px;font-weight:700;cursor:pointer
  }
  .zoom .hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.7);color:#fff;font-size:13px;padding:6px 12px;border-radius:20px;pointer-events:none;white-space:nowrap}
  @media (min-width:900px){ .zoom img{width:auto;max-width:min(1800px,100%)} }
  @media (prefers-reduced-motion:no-preference){ figure img{transition:opacity .3s} figure img[data-loading]{opacity:0} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>한신우동 가맹 카탈로그<span>2026.09</span></h1>
    <div class="counter" aria-live="polite"><b id="cur">1</b> / <span id="total">8</span></div>
  </div>
</header>

<main id="pages"></main>

<footer>
  본사: 경기도 수원시 팔달구 효원로 291번길 53 6층 미스앤미스터(주)<br>
  대표번호 1522-0975 · <a href="http://www.hanshinudong.com" style="color:inherit">www.hanshinudong.com</a>
</footer>

<nav class="cta" aria-label="가맹 문의">
  <div class="cta-in">
    <a class="call" href="tel:15220975">📞 가맹 상담 1522-0975</a>
    <a class="pdf" href="hanshin-udon-catalog.pdf" download>PDF 받기</a>
  </div>
</nav>

<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="페이지 확대 보기">
  <img id="zoomImg" alt="">
  <button type="button" id="zoomClose" aria-label="닫기">✕</button>
  <div class="hint">손가락으로 확대할 수 있습니다</div>
</div>

<script>
  var PAGES = [
    "표지 - 최소 비용으로 잘 버는 차별화된 한신우동, 가맹 업주 만족도 100% 브랜드",
    "한신우동의 경쟁력 - 차별화 메뉴, 쉬운 창업·운영, 업종변경 비용 최소화, 높은 회전율, 무이자 대출 지원",
    "압도적인 검색량과 유행 없는 아이템 - 매장별 월 매출 사례",
    "성공 창업의 신화 - 전국 매장 현황과 추가 출점 매장",
    "차별화된 경쟁력 - 운영시스템, 손쉬운 조리법, 높은 마진율과 대표 메뉴",
    "압도적인 수익률 - 매출 대비 비용 구성과 순이익",
    "가맹 개설 비용 안내",
    "뒷표지 - 한신우동 본사 연락처"
  ];
  var main = document.getElementById('pages');
  PAGES.forEach(function(alt, i){
    var n = String(i+1).padStart(2,'0');
    var f = document.createElement('figure');
    f.tabIndex = 0; f.dataset.page = i+1; f.setAttribute('role','button');
    f.setAttribute('aria-label', (i+1)+'페이지 크게 보기');
    f.innerHTML =
      '<picture>'+
        '<source type="image/webp" srcset="images/p'+n+'-900.webp 900w, images/p'+n+'-1800.webp 1800w" sizes="(max-width:760px) 100vw, 760px">'+
        '<img src="images/p'+n+'-1200.jpg" width="1854" height="2608" alt="'+alt+'" '+
        (i < 2 ? 'fetchpriority="high"' : 'loading="lazy" decoding="async"')+' data-loading>'+
      '</picture>';
    var img = f.querySelector('img');
    img.addEventListener('load', function(){ img.removeAttribute('data-loading'); });
    if (img.complete) img.removeAttribute('data-loading');
    f.addEventListener('click', function(){ openZoom(i+1, alt); });
    f.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openZoom(i+1, alt);} });
    main.appendChild(f);
  });
  document.getElementById('total').textContent = PAGES.length;

  // 현재 페이지 표시
  var cur = document.getElementById('cur');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting) cur.textContent = en.target.dataset.page; });
    }, {rootMargin:'-45% 0px -45% 0px'});
    document.querySelectorAll('figure').forEach(function(f){ io.observe(f); });
  }

  // 확대 보기
  var zoom = document.getElementById('zoom'), zImg = document.getElementById('zoomImg'), lastFocus;
  var webp = document.createElement('canvas').toDataURL('image/webp').indexOf('data:image/webp') === 0;
  function openZoom(p, alt){
    lastFocus = document.activeElement;
    var n = String(p).padStart(2,'0');
    zImg.src = webp ? 'images/p'+n+'-1800.webp' : 'images/p'+n+'-1200.jpg';
    zImg.alt = alt;
    zoom.classList.add('open'); zoom.scrollTop = 0;
    document.body.style.overflow = 'hidden';
    document.getElementById('zoomClose').focus();
    history.pushState({zoom:true}, '');
  }
  function closeZoom(fromPop){
    if(!zoom.classList.contains('open')) return;
    zoom.classList.remove('open'); document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
    if (!fromPop && history.state && history.state.zoom) history.back();
  }
  document.getElementById('zoomClose').addEventListener('click', function(){ closeZoom(false); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeZoom(false); });
  window.addEventListener('popstate', function(){ closeZoom(true); }); // 휴대폰 '뒤로가기'로 닫기
</script>
</body>
</html>
